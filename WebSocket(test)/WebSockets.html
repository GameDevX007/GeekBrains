<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Живой список участников</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        gap: 20px;
        padding: 20px;
        background: #f0f2f5;
      }
      .form-box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        height: fit-content;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .list-box {
        flex-grow: 1;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      input {
        display: block;
        margin-bottom: 10px;
        padding: 8px;
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .user-card {
        border-bottom: 1px solid #eee;
        padding: 10px 0;
        display: flex;
        align-items: center;
        gap: 10px;
        animation: fadeIn 0.5s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="form-box">
      <h3>Регистрация</h3>
      <input id="userName" type="text" placeholder="Имя" />
      <input id="userRole" type="text" placeholder="Роль (напр. Дизайнер)" />
      <button id="regBtn">Зарегистрироваться</button>
    </div>

    <div class="list-box">
      <h3>Участники в сети (<span id="count">0</span>)</h3>
      <div id="userList"></div>
    </div>

    <script>
      const userList = document.querySelector("#userList");
      const regBtn = document.querySelector("#regBtn");
      const countSpan = document.querySelector("#count");

      // Подключаемся к сокету (используем публичный канал для теста)
      const socket = new WebSocket("wss://socketsbay.com/wss/v2/1/demo/");

      // 1. СЛУШАЕМ СОКЕТ (Когда кто-то зарегистрировался)
      function addUserToUI(user) {
        const userList = document.querySelector("#userList");
        const div = document.createElement("div");
        div.className = "user-card";
        div.style.border = "1px solid #ccc";
        div.style.margin = "5px";
        div.style.padding = "10px";

        div.innerHTML = `
        <strong>${user.name}</strong> — <span>${user.role}</span>
    `;

        userList.prepend(div); // Добавляем в начало списка
      }

      // 2. Слушатель сообщений от сервера
      socket.onmessage = (event) => {
        // ВАЖНО: Сервер прислал строку, превращаем её в объект
        const data = JSON.parse(event.data);

        // Если в объекте есть пометка, что это новый юзер — рисуем!
        if (data.type === "REGISTER_USER") {
          addUserToUI(data.user);
        }
      };

      // 3. Функция регистрации (отправка)
      function register() {
        const name = document.querySelector("#userName").value;
        const role = document.querySelector("#userRole").value;

        const userObj = { name, role };
        const payload = {
          type: "REGISTER_USER",
          user: { name, role },
        };

        addUserToUI(userObj);
        // Шлем строку на сервер
        socket.send(JSON.stringify(payload));
      }

      regBtn.addEventListener("click", register);
    </script>
  </body>
</html>
